site_name: sysml2kit-rf-library
site_description: SysML v2 models for antenna/RF systems engineering
site_url: https://jman4162.github.io/sysml2kit-rf-library/
repo_url: https://github.com/jman4162/sysml2kit-rf-library
repo_name: jman4162/sysml2kit-rf-library

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - The models: models.md
  - Satcom examples: satcom-examples.md
  - Verification: verification.md
